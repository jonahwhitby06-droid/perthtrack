<!DOCTYPE html>
<html lang="en-AU" data-static="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account · PerthTrack</title>
<meta name="description" content="Your PerthTrack account and preferences.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' rx='2' transform='rotate(45 8 8)' fill='%23b8501a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="hdr"></div>
<main>
<div class="wrap"><div class="page-head"><h1>Account</h1><p><span id="who"></span></p></div></div>
<div class="wrap"><div class="grid2">
  <form class="card form" id="prefsForm" style="max-width:none">
    <h3 style="font-size:17px">What you're looking for</h3>
    <div><div class="sector" style="font-weight:600;margin-bottom:6px">Interests (used to rank Best bets)</div><div class="checks" id="interests"></div></div>
    <div class="checks"><label><input type="checkbox" id="finalYear"> I'm in my final year (prefer programs open to final-year students)</label></div>
    <button class="btn li-btn" type="button" data-connect-li style="justify-self:start"><span class="in">in</span> Connect LinkedIn</button>
    <label>Best bets weighting: fit vs low competition <input type="range" id="fitW" min="0" max="100" step="10"></label>
    <button class="btn" type="submit">Save preferences</button>
  </form>
  <div class="card" id="serverOnly">
    <h3 style="font-size:17px;margin-bottom:12px">Your data</h3>
    <div class="detail-actions" style="margin-top:0">
      <button class="btn ghost small" id="export">Download my data</button>
      <button class="btn ghost small" id="logout">Log out</button>
      <a class="btn ghost small" id="adminLink" href="admin.html" hidden>Admin</a>
      <button class="btn danger small" id="delete">Delete account</button>
    </div>
  </div>
</div></div>
</main>
<div id="ftr"></div>
<script src="assets/shared.js"></script>
<script src="assets/core.js"></script>
<script src="assets/network.js"></script>
<script src="assets/account.js"></script>
</body>
</html>
