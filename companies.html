<!DOCTYPE html>
<html lang="en-AU" data-static="1">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companies · PerthTrack</title>
<meta name="description" content="Browse every Perth finance firm and follow the ones you want alerts for.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' rx='2' transform='rotate(45 8 8)' fill='%23b8501a'/%3E%3C/svg%3E">

<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="hdr"></div>
<main>
<div class="wrap"><div class="page-head"><h1>Companies</h1><p>Follow a firm to put all of its programs on your watchlist and include it in your alerts.</p></div></div>
<div class="wrap">
  <div class="filters">
    <input id="q" type="search" placeholder="Search firms or teams" aria-label="Search firms" style="flex:1;min-width:220px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)">
    <label for="sector" class="sector">Sector</label><select id="sector"></select>
    <button class="chip" id="following" aria-pressed="false">★ Following</button>
    <button class="chip" id="netF" aria-pressed="false">👥 Where I know someone</button>
    <span class="sector" id="count"></span>
  </div>
  <div class="cos" id="cos"></div>
</div>
</main>
<div id="ftr"></div>
<script src="shared.js"></script>
<script src="core.js"></script>
<script src="network.js"></script>
<script src="teams.js"></script>
<script src="companies.js"></script>
</body>
</html>
